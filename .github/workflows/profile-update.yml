name: Profile Metrics

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update last refresh timestamp
        run: echo "$(date -u +%Y-%m-%d)" > .github/last-refresh.txt

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-refresh.txt
          git diff --staged --quiet || git commit -m "chore: อัปเดต profile metrics รายสัปดาห์"
          git push
