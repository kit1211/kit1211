name: Achievement Quest
description: ช่วยกันไล่ GitHub Achievements หรือถามเรื่อง dev
title: "[Quest] "
labels: ["achievement-quest"]
body:
  - type: markdown
    attributes:
      value: |
        ถามเรื่อง code, security, IoT หรือ AI ได้เลย — คำตอบที่ดีอาจช่วยไล่ **Galaxy Brain** 🧠
  - type: textarea
    id: question
    attributes:
      label: คำถาม / สิ่งที่อยากทำ
      description: อธิบายสั้นๆ ว่าอยากได้อะไร
      placeholder: "เช่น อยากได้ Pull Shark tier ถัดไป ต้อง merge PR กี่อัน?"
    validations:
      required: true
  - type: dropdown
    id: achievement
    attributes:
      label: Achievement ที่เกี่ยวข้อง
      options:
        - Pull Shark
        - Galaxy Brain
        - Starstruck
        - Pair Extraordinaire
        - Public Sponsor
        - อื่นๆ / ไม่เกี่ยว
    validations:
      required: false
